services:
  - type: web
    name: masterprose-web
    env: node
    region: oregon
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    healthCheckPath: /ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: AUTH_SECRET
        value: mP9xK2vL8nQ4wR7tY3uJ6hD5fG1bC0eA
      - key: POSTGRES_URL
        fromDatabase:
          name: masterprose-db
          property: connectionString

databases:
  - name: masterprose-db
    databaseName: masterprose
    user: masterprose
    plan: free
    region: oregon
